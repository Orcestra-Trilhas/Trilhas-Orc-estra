      - Unidade III – HTML & CSS Intermediário: trilha-frontend/unidade-3.md
      - Unidade IV – HTML & CSS Avançado: trilha-frontend/unidade-4.md
      - Unidade V – JavaScript: trilha-frontend/unidade-5.md
      - Unidade VI – React: trilha-frontend/unidade-6.md
      - Desafios Práticos: trilha-frontend/desafio.md
  - Back-end:
      - Visão Geral: trilha-backend/index.md
      - Unidade I – Ambiente: trilha-backend/unidade-1.md
      - Unidade II – Java POO: trilha-backend/unidade-2.md
      - Unidade III – Estruturas de Dados: trilha-backend/unidade-3.md
      - Unidade IV – Banco de Dados: trilha-backend/unidade-4.md
      - Unidade V – Métodos HTTP: trilha-backend/unidade-5.md
      - Unidade VI – Spring Boot: trilha-backend/unidade-6.md
      - Unidade VII – Spring Security: trilha-backend/unidade-7.md
